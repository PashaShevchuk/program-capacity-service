name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same version as local development; .nvmrc is the single source.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # Integration tests start their own PostgreSQL container through
      # Testcontainers, using the Docker daemon the runner already provides.
      - name: Integration tests
        run: npm run test:integration

      # Production dependencies only: the test stack pulls in advisories through
      # Testcontainers that never reach the shipped image.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: program-capacity-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
